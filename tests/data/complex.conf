# Global settings
ServerAliveInterval 60
Include config.d/* "extra dir/*.conf"

# Work machines
Host work-* !work-legacy
	User bob
	IdentityFile "~/.ssh/id work"
  port=2222
HOSTNAME = work.example.com   

Host   jump    bastion  # trailing comment
    ProxyJump=none
    SomeFutureKeyword value
    IdentityFile ~/.ssh/id_ed25519
    IdentityFile ~/.ssh/id_rsa
    identityfile ~/.ssh/id_third

    # indented comment inside a block
Match host *.internal exec "test -f /tmp/x"
    User internal

Host ?ingle
  Compression yes
